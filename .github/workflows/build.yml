name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assemble -Pmc=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v4
        with:
          name: cxvisuals-${{ matrix.minecraft }}
          path: build/libs/cxvisuals-*+${{ matrix.minecraft }}.jar
